name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: xdebug
          extensions: ctype, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, tokenizer, xml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: PHP security audit
        run: composer audit

      - name: PHP tests with coverage
        run: XDEBUG_MODE=coverage composer test:coverage

      - name: PHP static analysis and style
        run: composer lint

      - name: Node security audit
        run: npm run audit

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E on SQLite
        run: npm run test:e2e
